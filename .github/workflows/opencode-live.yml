name: OpenCode live canary

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Business E2E case operated by OpenCode
        required: false
        default: chat-basic
        type: choice
        options:
          - chat-basic
          - chat-create-html
          - chat-image-attachment
          - design-draft-confirm
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: opencode-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conversation-canary:
    name: Real provider conversation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Require dedicated OpenCode credential
        run: test -n "$OPENCODE_API_KEY"
      - run: npm ci
      - name: Install the OpenCode CLI version paired with the SDK
        run: npm install --global opencode-ai@1.18.13
      - run: npm run build:server
      - name: Run real OpenCode operator against the OpenCode core
        env:
          BUSINESS_E2E_CASE: ${{ inputs.scenario || 'chat-basic' }}
        run: npm run business:e2e -- --operator opencode --providers opencode --case "$BUSINESS_E2E_CASE" --lang en
