name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test:ci-scripts
      - run: npm run check:no-double-assertions

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04+ AppArmor blocks unprivileged userns required by bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native
      - run: npm ci
      - name: Rust tests
        # The native suite launches many short-lived sandbox/network processes.
        # Serial execution avoids runner resource contention; no-fail-fast keeps
        # complete diagnostics when a real regression affects multiple crates.
        run: cargo test --manifest-path native/Cargo.toml --no-fail-fast -- --test-threads=1
      - name: Rust build check
        run: cargo check --manifest-path native/Cargo.toml --release

  rust-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native
      - name: macOS Rust tests
        # Seatbelt and PTY behavior is compiled only on macOS; the Ubuntu job
        # cannot detect regressions in those platform-specific modules.
        run: cargo test --manifest-path native/Cargo.toml --no-fail-fast -- --test-threads=1
      - name: macOS Rust build check
        run: cargo check --manifest-path native/Cargo.toml --release

  rust-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native
      - name: Windows Rust tests
        # Windows sandbox and process code is cfg-gated and is not compiled by
        # either Unix native-test job.
        run: cargo test --manifest-path native/Cargo.toml --no-fail-fast -- --test-threads=1
      - name: Windows Rust build check
        run: cargo check --manifest-path native/Cargo.toml --release

  package-smoke:
    needs: [quality, test]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      runner: ubuntu-24.04
      builder-args: --linux --x64
      # Must match runtimePlatform() in package-server-sea.mjs (not the
      # build.yml default "package", which is only an upload artifact label).
      artifact-name: linux-amd64
      smoke-unpacked: true
      upload-artifact: false
