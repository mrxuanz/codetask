name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: '1. Start codetask...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, credentials, personal paths, and proprietary source before posting.
      render: shell
