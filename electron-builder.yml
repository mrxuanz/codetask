appId: io.github.mrxuanz.codetask
productName: codetask
directories:
  buildResources: build
# Keep only the UI languages shipped by codetask. Electron otherwise bundles
# every Chromium locale on every platform.
electronLanguages:
  - en
  - en-US
  - zh-CN
  - zh_CN
  - ja
files:
  # Keep application sources and repository tooling out of app.asar. Production
  # dependencies are collected separately by electron-builder.
  - package.json
  - out/main/**
  - out/renderer/**
  - resources/**
  - native/codeteam-sandbox/index.js
  - native/codeteam-sandbox/package.json
  - native/codeteam-sandbox/runner-entry.js
  - native/codeteam-sandbox/setup-entry.js
  - native/codeteam-sandbox/*.node
  - native/codeteam-sandbox/helpers/**
  - '!node_modules/**/{test,tests,__tests__,example,examples}/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD_PARTY_DEPENDENCIES.md
    to: THIRD_PARTY_DEPENDENCIES.md
asarUnpack:
  - resources/**
  - native/codeteam-sandbox/**
win:
  executableName: codetask
  target:
    - nsis
    - zip
    - portable
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
mac:
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: mrxuanz <https://github.com/mrxuanz>
  category: Utility
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  depends:
    - libnss3
    - libgbm1
    - libgtk-3-0
    - libasound2
npmRebuild: true
